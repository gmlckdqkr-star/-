# O'Neil CANSLIM price parts (giant_trend PRECOMMIT_GT 4.7 ONE-L): L = 6-month leaders, N = within 5% of 52-week high,
# M = market direction (PIT EW member index above its 200-day average), else cash. Textbook constants, not searched.
name: gt_one_l
family: giant_trend
known: 2
idea: O'Neil leaders near 52w highs, only while the EW member index is above SMA200
universe: sp500
signals:
  up: "price(_SP500EW) > sma(_SP500EW, 200)"
stock:
  rebalance: month
  filter: "high_dist(252) >= -0.05"
  score: "ret(126, 0)"
  top: 20
  weight: equal
  max_weight: 0.10
  exposure: up
  else: {CASH: 1.0}
